<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube字幕検索 V2</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0; padding: 0; line-height: 1.6;
      background: #0e1117; color: #e6e6e6;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: #9aa0a6; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea, input[type=text] {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #333a45; background: #1a1f29; color: #e6e6e6;
      font-size: 0.95rem; font-family: inherit;
    }
    textarea { height: 180px; resize: vertical; }
    button {
      cursor: pointer; border: none; border-radius: 8px; font-weight: 700;
      padding: 12px 18px; font-size: 1rem;
    }
    .primary { background: #ff4b4b; color: #fff; width: 100%; margin-top: 16px; }
    .primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .ghost { background: #262d38; color: #e6e6e6; }
    .bar { height: 8px; background: #262d38; border-radius: 6px; overflow: hidden; margin: 16px 0 6px; }
    .bar > span { display: block; height: 100%; width: 0; background: #ff4b4b; transition: width .2s; }
    .status { color: #9aa0a6; font-size: 0.85rem; min-height: 1.2em; }
    .card {
      border: 1px solid #262d38; border-radius: 10px; padding: 14px 16px;
      margin: 12px 0; background: #151a23;
    }
    .card .title { font-weight: 700; color: #cfd3d8; }
    .card .time { font-size: 1.1rem; font-weight: 700; margin: 4px 0; }
    .card .kw { color: #ff8a8a; font-weight: 600; }
    .card a { color: #6fb3ff; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin: 8px 0 4px; flex-wrap: wrap; }
    .count { font-weight: 700; }
    .err { color: #ff8a8a; font-size: 0.85rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 0.9rem; }
    th, td { border-bottom: 1px solid #262d38; padding: 8px; text-align: left; vertical-align: top; }
    th { color: #9aa0a6; font-weight: 600; }
    .tabs { display: flex; gap: 8px; margin: 16px 0 8px; }
    .tab { padding: 8px 14px; border-radius: 8px 8px 0 0; background: #1a1f29; cursor: pointer; }
    .tab.active { background: #262d38; font-weight: 700; }
    .hidden { display: none; }
    .table-scroll { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📺 YouTube字幕検索アプリ V2</h1>
    <p class="sub">複数の動画から、複数のキーワードをまとめて検索できます。</p>

    <div class="grid">
      <div>
        <label for="urls">YouTube動画のURL（複数可・改行区切り）</label>
        <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=...">https://www.youtube.com/watch?v=j9YpkSX7NNM</textarea>
      </div>
      <div>
        <label for="keywords">検索キーワード（複数可・カンマ/スペース区切り）</label>
        <input id="keywords" type="text" placeholder="例: AI, Python, 機械学習" value="Python, AI" />
        <p class="sub" style="margin-top:12px">
          ※ 字幕がない動画や無効なURLはスキップされます。<br />
          ※ OR検索（いずれかのキーワードを含む行がヒット）。
        </p>
      </div>
    </div>

    <button id="run" class="primary">検索開始 🚀</button>

    <div class="bar"><span id="progress"></span></div>
    <div id="status" class="status"></div>

    <div id="output"></div>
  </div>

  <script>
    // --- URLから動画IDを抽出 ---
    function extractVideoId(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        if (u.hostname === "youtu.be") return u.pathname.slice(1) || null;
        if (u.hostname === "www.youtube.com" || u.hostname === "youtube.com" || u.hostname === "m.youtube.com") {
          if (u.pathname === "/watch") return u.searchParams.get("v");
          if (u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2] || null;
          if (u.pathname.startsWith("/v/")) return u.pathname.split("/")[2] || null;
          if (u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2] || null;
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    function parseKeywords(raw) {
      return raw.replace(/[、,]/g, " ").split(/\s+/).map(s => s.trim()).filter(Boolean);
    }

    const runBtn = document.getElementById("run");
    const progress = document.getElementById("progress");
    const statusEl = document.getElementById("status");
    const output = document.getElementById("output");

    let lastRows = [];

    runBtn.addEventListener("click", async () => {
      const urlsRaw = document.getElementById("urls").value;
      const keywords = parseKeywords(document.getElementById("keywords").value);

      const urls = urlsRaw.split("\n").map(s => s.trim()).filter(Boolean);
      if (urls.length === 0) { alert("YouTubeのURLを入力してください。"); return; }
      if (keywords.length === 0) { alert("検索キーワードを入力してください。"); return; }

      const jobs = urls
        .map(url => ({ url, videoId: extractVideoId(url) }))
        .filter(j => j.videoId);

      if (jobs.length === 0) { alert("有効なYouTube URLが見つかりませんでした。"); return; }

      runBtn.disabled = true;
      output.innerHTML = "";
      lastRows = [];
      const errors = [];
      progress.style.width = "0%";

      for (let i = 0; i < jobs.length; i++) {
        const { url, videoId } = jobs[i];
        statusEl.textContent = `検索中 (${i + 1}/${jobs.length}): ${videoId}`;
        try {
          const res = await fetch("/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ videoId, keywords }),
          });
          const data = await res.json();
          if (data.error) {
            errors.push(`${videoId}: ${data.error}`);
          } else {
            for (const r of data.results) {
              lastRows.push({
                title: data.title,
                videoId,
                originalUrl: url,
                keyword: r.keywords.join(", "),
                time: r.time,
                text: r.text,
                link: r.link,
              });
            }
          }
        } catch (e) {
          errors.push(`${videoId}: ${e.message}`);
        }
        progress.style.width = `${Math.round(((i + 1) / jobs.length) * 100)}%`;
      }

      statusEl.textContent = "完了！";
      render(lastRows, errors);
      runBtn.disabled = false;
    });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function render(rows, errors) {
      if (rows.length === 0) {
        output.innerHTML = `<p class="sub">指定したキーワードは見つかりませんでした。</p>`;
      } else {
        let html = `
          <div class="toolbar">
            <span class="count">🎉 合計 ${rows.length} 件 ヒット</span>
            <button class="ghost" id="csv">📥 CSVダウンロード</button>
          </div>
          <div class="tabs">
            <div class="tab active" data-tab="list">📋 リスト表示</div>
            <div class="tab" data-tab="table">📊 データテーブル</div>
          </div>
          <div id="tab-list">`;
        for (const r of rows) {
          html += `
            <div class="card">
              <div class="title">🎬 ${esc(r.title)}</div>
              <div class="time">${esc(r.time)} <span class="kw">(${esc(r.keyword)})</span></div>
              <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.text)}</a>
            </div>`;
        }
        html += `</div><div id="tab-table" class="hidden table-scroll"><table>
          <thead><tr><th>タイトル</th><th>キーワード</th><th>時間</th><th>テキスト</th><th>リンク</th></tr></thead><tbody>`;
        for (const r of rows) {
          html += `<tr>
            <td>${esc(r.title)}</td><td>${esc(r.keyword)}</td><td>${esc(r.time)}</td>
            <td>${esc(r.text)}</td>
            <td><a href="${esc(r.link)}" target="_blank" rel="noopener">再生 ▶️</a></td>
          </tr>`;
        }
        html += `</tbody></table></div>`;
        output.innerHTML = html;

        document.querySelectorAll(".tab").forEach(t => {
          t.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
            t.classList.add("active");
            const which = t.dataset.tab;
            document.getElementById("tab-list").classList.toggle("hidden", which !== "list");
            document.getElementById("tab-table").classList.toggle("hidden", which !== "table");
          });
        });
        document.getElementById("csv").addEventListener("click", () => downloadCsv(rows));
      }

      if (errors.length) {
        const div = document.createElement("div");
        div.style.marginTop = "16px";
        div.innerHTML = `<p class="err">⚠️ 取得できなかった動画 (${errors.length}件):</p>`;
        const ul = document.createElement("ul");
        errors.forEach(e => {
          const li = document.createElement("li");
          li.className = "err";
          li.textContent = e;
          ul.appendChild(li);
        });
        div.appendChild(ul);
        output.appendChild(div);
      }
    }

    function downloadCsv(rows) {
      const headers = ["Title", "Video ID", "Original URL", "Keyword", "Time", "Text", "Link"];
      const csvRows = [headers.join(",")];
      for (const r of rows) {
        const vals = [r.title, r.videoId, r.originalUrl, r.keyword, r.time, r.text, r.link];
        csvRows.push(vals.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
      }
      // UTF-8 BOM付きでExcelでも文字化けしないように
      const blob = new Blob(["﻿" + csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const ts = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 15);
      a.href = url;
      a.download = `youtube_search_results_${ts}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
